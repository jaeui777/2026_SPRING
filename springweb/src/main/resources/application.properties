spring.application.name=springweb
# 주석 : .properties 파일의 주석 방법
# application.properties 파일이란? spring 관련 설저 코드 입력하는 곳
# 1. 내장 톰캣의 포트번호 변경 , 기본값이 8080
server.port= 8080
# 2. 데이터베이스연동
# 2-1. 연동 할 DB 주소
spring.datasource.url = jdbc:mysql://localhost:3306/mydb0902

# 2-2 연동할 db서버의 계정/비밀번호 , 띄어쓰기 주의
spring.datasource.username=root
spring.datasource.password=1234